name: Prototype checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-graph-cpu.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -r requirements-graph-cpu.lock
      - run: python -X utf8 -m unittest discover -s tests -v
